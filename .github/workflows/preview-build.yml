name: Preview build - GRACEON Tahiti
on:
  push:
    branches: [graceon-premium-redesign]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: graceon-premium-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tahiti-preview-build
          path: dist
          retention-days: 7
