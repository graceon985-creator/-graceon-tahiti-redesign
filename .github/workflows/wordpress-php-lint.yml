name: WordPress PHP syntax check

on:
  push:
    branches:
      - graceon-premium-redesign
    paths:
      - 'wordpress-theme/**/*.php'
      - 'wordpress-plugin/**/*.php'
      - '.github/workflows/wordpress-php-lint.yml'
  pull_request:
    branches:
      - graceon-premium-redesign
    paths:
      - 'wordpress-theme/**/*.php'
      - 'wordpress-plugin/**/*.php'
      - '.github/workflows/wordpress-php-lint.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: |
          find wordpress-theme wordpress-plugin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
